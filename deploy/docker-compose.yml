name: drawio-cloud
services:
  drawio-cloud:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: drawio-cloud:local
    restart: unless-stopped
    init: true
    stop_grace_period: 15s
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    environment:
      DATA_DIR: /data
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?请设置浏览器访问的外部入口，例如 http://192.168.1.10:8080}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-${PUBLIC_ORIGIN}}
      MAX_DOCUMENT_BYTES: ${MAX_DOCUMENT_BYTES:-20971520}
      COOKIE_MODE: ${COOKIE_MODE:-http}
      HOST: 127.0.0.1
      PORT: "3000"
      TRUSTED_PROXIES: 127.0.0.1
    volumes:
      - data:/data
volumes:
  data:
    name: ${DATA_VOLUME_NAME:-drawio-cloud-data}
